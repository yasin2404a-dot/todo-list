
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Todo List</title>
</head>

<body class="bg-blue-900 text-white flex justify-center items-center min-h-screen">

    <div class="main mt-10 w-full max-w-2xl px-4">

        <h1 class="text-4xl font-bold text-center mb-5">Todo List</h1>

        
<form onsubmit="event.preventDefault(); add();" class="flex gap-2">

    <input
        type="text"
        id="input"
        placeholder="Enter any task..."
        class="p-3 bg-blue-950 rounded-full flex-1 outline-none"
    >

    <button
        type="submit"
        id="addBtn"
        class="bg-blue-950 rounded-full px-6 py-3 hover:bg-blue-700">
        Add
    </button>

    <button
        type="button"
        id="updateBtn"
        onclick="updateTask()"
        class="bg-green-600 rounded-full px-6 py-3 hover:bg-green-700 hidden">
        Update
    </button>

</form>


        <div class="list bg-blue-400 mt-5 p-5 rounded-xl">

            <!-- SEARCH OPTION -->
            <input
                type="text"
                id="search"
                placeholder="🔍 Find your task..."
                oninput="searchTasks()"
                class="w-full p-3 mb-4 rounded-lg bg-blue-950 text-white outline-none placeholder-gray-300"
            >

            <div class="overflow-x-auto">

                <table class="w-full">

                    <thead class="bg-slate-950">

                        <tr>
                            <th class="p-3">S.No</th>
                            <th class="text-start p-3">Details</th>
                            <th class="p-3">Action</th>
                        </tr>

                    </thead>

                    <tbody id="dynamiclist"></tbody>

                </table>

            </div>

            <p id="noResult" class="text-center text-blue-950 mt-3 hidden">
                No task found!
            </p>

        </div>

    </div>

    <script src="todolist.js"></script>

</body>
</html>
